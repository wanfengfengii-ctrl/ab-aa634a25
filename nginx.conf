server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 健康检查端点（供 Docker / Compose healthcheck 与验收脚本使用）
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # 单页应用回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
