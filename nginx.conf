server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 纯静态资源，长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其余路径回退到 SPA 入口
    location / {
        try_files $uri $uri/ /index.html;
    }
}
